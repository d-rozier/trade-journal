<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Journal — free futures trading journal</title>
<meta name="description" content="A free, private trading journal for futures traders. Import Rithmic R Trader Pro CSVs, track P&L and R, grade trades, and keep screenshot folders. Runs entirely in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>:root{
  --bg:#f4f5fa; --card:#ffffff; --card-2:#f8f9fc; --border:#e4e6ef; --border-2:#eef0f6;
  --text:#14142b; --text-2:#55566b; --muted:#8a8ba0;
  --side:#15152a; --side-2:#1f1f3a; --side-text:#b9b9d6; --side-active:#ffffff;
  --accent:#6d5dfc; --accent-2:#8c7fff; --accent-soft:#eeecff;
  --win:#0a8f2e; --win-bg:#e3f6e9; --win-strong:#16a34a;
  --loss:#d03b3b; --loss-bg:#fde8e8; --loss-strong:#e5484d;
  --warn:#c98500; --grid:#eceef4; --shadow:0 1px 2px rgba(20,20,43,.05),0 2px 8px rgba(20,20,43,.04);
  --radius:12px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f0f1a; --card:#181827; --card-2:#1f1f31; --border:#2a2a40; --border-2:#24243a;
  --text:#ececf6; --text-2:#b4b4c9; --muted:#7f7f99;
  --side:#0b0b14; --side-2:#1a1a2e; --side-text:#a4a4c4;
  --accent:#8c7fff; --accent-2:#a69cff; --accent-soft:#26234a;
  --win:#34c25a; --win-bg:#123222; --win-strong:#2fbf4a;
  --loss:#ff6b6b; --loss-bg:#3a1a1e; --loss-strong:#e66767;
  --grid:#25253a; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow-x:hidden}
.drawer:not(.on){visibility:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:flex;min-height:100vh}

/* Sidebar */
.side{width:232px;flex:none;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#b06cff);display:grid;place-items:center}
.btn-add{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 12px;font-weight:600;cursor:pointer;margin:0 4px 16px}
.btn-add:hover{filter:brightness(1.08)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--side-text);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.active{background:var(--side-2);color:var(--side-active)}
.nav a.active svg{color:var(--accent-2)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.store-pill{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--win-strong)} .dot.warn{background:#fab219}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:16px 28px 12px;flex-wrap:wrap;border-bottom:1px solid transparent}
.topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel,.inp{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 10px;min-height:36px;outline:none}
.sel:focus,.inp:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.icon-btn:hover{color:var(--text)}
.content{padding:8px 28px 40px;display:flex;flex-direction:column;gap:18px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 6px}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-b{padding:8px 18px 16px}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
.win{color:var(--win)} .loss{color:var(--loss)}
.small{font-size:12px}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1.6fr)}
.g-dash2{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}

/* KPI tiles */
.kpi{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:92px}
.kpi .lbl{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;font-weight:500}
.kpi .val{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--card-2);color:var(--text-2);border:1px solid var(--border)}
.wl-bar{width:110px}
.wl-bar .bar{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px;margin-top:6px}
.wl-bar .bar span:first-child{background:var(--win-strong);border-radius:4px}
.wl-bar .bar span:last-child{background:var(--loss-strong);border-radius:4px}
.wl-bar .nums{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:600}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head .m{font-weight:600;min-width:130px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.05fr);gap:6px}
.cal .dow{font-size:11.5px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal .cell{overflow:hidden;min-height:84px;border:1px solid var(--border-2);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;background:var(--card);cursor:default;position:relative}
.cal .cell.other{opacity:.35}
.cal .cell .dn{font-size:11.5px;color:var(--muted);font-weight:600;align-self:flex-end}
.cal .cell.has{cursor:pointer}
.cal .cell.pos{background:var(--win-bg);border-color:transparent}
.cal .cell.neg{background:var(--loss-bg);border-color:transparent}
.cal .cell .pl{font-weight:700;font-size:14px;margin-top:auto;font-variant-numeric:tabular-nums}
.cal .cell .tc{font-size:11px;color:var(--text-2)}
.cal .cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .wk{min-height:84px;border-radius:9px;padding:6px 10px;background:var(--card-2);border:1px solid var(--border-2);display:flex;flex-direction:column;justify-content:center}
.cal .wk .wl{font-size:11px;color:var(--muted);font-weight:600}
.cal .wk .pl{font-weight:700;font-variant-numeric:tabular-nums}

/* Tables */
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);cursor:default}
.tbl th.sort{cursor:pointer}
.tbl th.sort:hover{color:var(--text)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border-2);white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--card-2)}
.tbl .r{text-align:right}
.side-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.side-tag.L{background:var(--win-bg);color:var(--win)} .side-tag.S{background:var(--loss-bg);color:var(--loss)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin:1px 2px 1px 0}
.chip.m{background:var(--loss-bg);color:var(--loss)}
.chip.sel-chip{cursor:pointer;background:var(--card-2);color:var(--text-2);border:1px solid var(--border)}
.chip.sel-chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.sel-chip.m.on{background:var(--loss-bg);color:var(--loss);border-color:var(--loss)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--loss)} .btn.danger:hover{border-color:var(--loss)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--text-2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* Journal day card */
.day-card .day-h{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border-2);flex-wrap:wrap}
.day-card .day-h .d{font-weight:700;font-size:15px}
.day-card .day-b{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding:14px 18px}
.mini-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px}
.mini-stats .k{font-size:11.5px;color:var(--muted)} .mini-stats .v{font-weight:650;font-variant-numeric:tabular-nums}
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 16px}
textarea{width:100%;min-height:90px;background:var(--card-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;resize:vertical;outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--text-2)}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,10,25,.45);z-index:50;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);z-index:60;transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer.on{transform:none}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-b{padding:16px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:90vh;overflow:auto;background:var(--card);border-radius:14px;z-index:70;display:none;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.on{display:block}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;cursor:pointer;background:var(--card-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{margin:0;padding-left:20px;color:var(--text-2);font-size:13px}
.steps li{margin:3px 0}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv>div{background:var(--card-2);border-radius:9px;padding:9px 11px}
.kv .k{font-size:11.5px;color:var(--muted)} .kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;cursor:pointer;font-size:20px;color:var(--border);padding:0 1px;line-height:1}
.stars button.on{color:#f5b301}
.yn{display:inline-flex;gap:6px}
.yn button{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.yn button.on.y{background:var(--win-bg);color:var(--win);border-color:var(--win)}
.yn button.on.n{background:var(--loss-bg);color:var(--loss);border-color:var(--loss)}
.shot{border:1px dashed var(--border);border-radius:10px;min-height:120px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:10px;cursor:pointer;background:var(--card-2)}
.shot img{max-width:100%;border-radius:8px;display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#14142b;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-weight:500;display:none;max-width:90vw}
.toast.on{display:block}
.empty{padding:50px 20px;text-align:center;color:var(--text-2)}
.empty h2{margin:0 0 6px;color:var(--text);font-size:20px}
.banner{background:var(--accent-soft);color:var(--text);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:220px}
.score-big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.score-bar{height:8px;border-radius:5px;background:linear-gradient(90deg,var(--loss-strong),#fab219,var(--win-strong));position:relative;margin:8px 0 4px}
.score-bar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--text)}
.notebook{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;min-height:520px}
.note-list{display:flex;flex-direction:column;gap:4px;padding:10px}
.note-item{padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.note-item:hover{background:var(--card-2)}
.note-item.on{background:var(--accent-soft);border-color:var(--accent)}
.note-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(5,16px);gap:4px;overflow-x:auto;padding-bottom:6px}
.heat i{width:16px;height:16px;border-radius:4px;background:var(--card-2);border:1px solid var(--border-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.pb-card .rules{margin:8px 0 0;padding-left:18px;color:var(--text-2)}
.stat-list{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.stat-list>div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-2);font-variant-numeric:tabular-nums}
.stat-list>div span:first-child{color:var(--text-2)}
.stat-list>div span:last-child{font-weight:650}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;color:var(--text-2)}

@media (max-width:1200px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.g-dash{grid-template-columns:1fr 1fr}.g-dash>.card:first-child{grid-column:span 2}}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:30;flex-direction:row;align-items:center;padding:8px 10px;gap:8px;overflow-x:auto}
  .brand{padding:0 6px 0 0}.brand span{display:none}
  .btn-add{margin:0;padding:8px 10px}.btn-add span{display:none}
  .nav{flex-direction:row}.nav a{padding:8px 10px;white-space:nowrap}.nav a span{display:none}
  .side-foot{display:none}
  .topbar{padding:12px 14px;position:static}.content{padding:6px 14px 30px}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2,.g-3,.g-dash,.g-dash2{grid-template-columns:1fr}.g-dash>.card:first-child{grid-column:auto}
  .day-card .day-b{grid-template-columns:1fr}.notes-grid{grid-template-columns:1fr}
  .cal{gap:3px}.cal .cell,.cal .wk{min-height:58px;padding:4px}.cal .cell .pl{font-size:11px}.cal .cell .tc,.cal .wk .small,.cal .wk .wl{display:none}.cal .wk .pl{font-size:11px}.kpi .wl-bar{width:90px}
  .notebook{grid-template-columns:1fr}.stat-list{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr}
  .mini-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.rule-list{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.rule-row{display:flex;align-items:center;gap:4px;border-radius:8px;padding:1px 2px}
.rule-row:hover{background:var(--card-2)}
.rule-row .rn{width:22px;flex:none;color:var(--muted);font-size:12.5px;text-align:right;padding-right:4px;font-weight:600}
.rule-inp{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;outline:none;color:var(--text-2);font-size:13.5px}
.rule-inp:hover{border-color:var(--border)}
.rule-inp:focus{border-color:var(--accent);background:var(--card);color:var(--text);box-shadow:0 0 0 3px var(--accent-soft)}
.rule-row.add .rule-inp{border-color:var(--border);border-style:dashed}
.rb{border:0;background:transparent;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:6px;opacity:0;flex:none}
.rule-row:hover .rb,.rule-row:focus-within .rb{opacity:1}
.rb:hover:not(:disabled){background:var(--border-2);color:var(--text)}
.rb.del:hover{color:var(--loss)}
.rb:disabled{opacity:0!important;cursor:default}
@media (hover:none){.rb{opacity:1}}
.btn.ghost.danger{color:var(--loss)}

.seg.mini{padding:2px;border-radius:7px}
.seg.mini button{padding:2px 8px;font-size:11.5px;border-radius:5px}
.kpi .lbl .spacer{flex:1}
.seg.mini{flex-wrap:nowrap;flex:none}
@media (max-width:860px){.kpi>div+div:not(.wl-bar),.kpi>svg{display:none}.kpi .lbl{flex-wrap:wrap}}
/* Folders */
.nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:16px 12px 6px;font-weight:600}
.nav-count{margin-left:auto;font-style:normal;font-size:11px;background:var(--side-2);color:var(--side-text);border-radius:999px;padding:1px 7px;font-weight:600}
.nav a.active .nav-count{background:var(--accent);color:#fff}
.nav a.drop-over{outline:2px dashed var(--accent-2);outline-offset:-2px;background:var(--side-2);color:#fff}
.gal-drop{padding:18px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gal-item{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:zoom-in;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;outline:none}
.gal-item:hover,.gal-item:focus-visible{transform:translateY(-2px);border-color:var(--accent)}
.gal-item.loading{cursor:default}
.gal-thumb{aspect-ratio:16/10;background:var(--card-2);display:grid;place-items:center;overflow:hidden}
.gal-thumb img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.gal-meta{padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-height:52px}
.gal-cap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(8,8,16,.94);display:none;flex-direction:column;color:#fff}
.lightbox.on{display:flex}
.lb-top{display:flex;align-items:center;gap:8px;padding:12px 16px}
.lb-btn{color:#ddd}.lb-btn:hover{color:#fff;border-color:#666}
.lb-x{background:transparent;border-color:#444;color:#ddd}
.lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px}
.lb-stage img{max-width:calc(100% - 120px);max-height:100%;object-fit:contain;border-radius:6px;background:#111}
.lb-nav{width:48px;height:48px;border-radius:50%;border:1px solid #444;background:rgba(255,255,255,.06);color:#fff;font-size:26px;cursor:pointer;flex:none}
.lb-nav:disabled{opacity:.25;cursor:default}
.lb-bottom{display:flex;gap:10px;padding:12px 16px 18px;max-width:1000px;width:100%;margin:0 auto}
.lb-bottom .inp{background:#1b1b26;border-color:#333;color:#fff}
.lb-bottom #lb-cap{flex:1}
.drop-overlay{position:fixed;inset:12px;z-index:85;border:3px dashed var(--accent);border-radius:16px;background:rgba(109,93,252,.12);display:none;place-items:center;pointer-events:none;font-size:20px;font-weight:700;color:var(--accent)}
.drop-overlay.on{display:grid}
@media (max-width:860px){.nav-sec{display:none}.nav-count{display:none}.gal-grid{grid-template-columns:1fr 1fr;gap:10px}.lb-stage img{max-width:100%}.lb-nav{position:absolute;bottom:90px}#lb-prev{left:16px}#lb-next{right:16px}.lb-bottom{flex-direction:column}}
.lb-sel{background:#1b1b26;border-color:#333;color:#ddd;min-height:34px}
/* Pre-market screenshots */
.pm-wrap{padding:0 18px 14px}
.pm-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pm-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pm-thumb{flex:none;width:200px;height:118px;border-radius:10px;border:1px solid var(--border);overflow:hidden;padding:0;background:var(--card-2);cursor:zoom-in;display:grid;place-items:center}
.pm-thumb:hover{border-color:var(--accent)}
.pm-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pm-loading{cursor:default}
.pm-add{flex:none;width:200px;height:118px;border-radius:10px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--card-2);text-align:center;padding:8px;outline:none}
.pm-add:hover,.pm-add:focus-visible,.pm-add.over{border-color:var(--accent);background:var(--accent-soft)}
.pm-add:focus-visible b{color:var(--accent)}
@media (max-width:860px){.pm-thumb,.pm-add{width:150px;height:92px}}
.grade{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;letter-spacing:.02em;line-height:1.4}
.grade.gA{background:var(--accent-soft);color:var(--accent)}
.grade.gB{background:#d4d6e3;color:#1f2033}
:root[data-theme="dark"] .grade.gB{background:#4b4c6b;color:#ffffff}
.cal .cell .cal-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cal .cell .cal-top .dn{margin-left:auto}
@media (max-width:860px){.cal .cell .grade{font-size:9px;padding:0 3px}}
:root[data-theme="dark"] .grade.gA{background:#6d5dfc;color:#ffffff}

.snap-prev{max-height:62vh;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--card-2)}
.snap-prev img{width:100%;display:block}

.guide{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.guide-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gs{display:flex;gap:10px;background:var(--card-2);border:1px solid var(--border-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-2)}
.gs b{color:var(--text)}
.gn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
@media (max-width:860px){.guide-steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="loading" id="loading">Loading your journal…</div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div><span>Trade Journal</span></div>
    <button class="btn-add" id="add-btn" title="Import trades"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Add trades</span></button>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div id="store-status"></div></div>
  </aside>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Trade details"></div>

<div class="drop-overlay" id="drop-overlay">Drop to add images</div>

}

function rNote(trades, useR) { if (!useR) return ""; const closed = trades.filter(t => !t.open), miss = closed.filter(t => t.r === null || t.r === undefined).length;
  if (!closed.length || !miss) return ""; return `<div class="small muted" style="margin-top:6px">${miss === closed.length ? `No trades have a risk set yet. <a href="#config">Set a default risk</a> to see R.` : `${miss} trade${miss === 1 ? "" : "s"} without risk left out.`}</div>`; }
function kpiUnit() { if (!App.kpiUnit) { try { App.kpiUnit = localStorage.getItem("tj.kpiUnit") || "$"; } catch { App.kpiUnit = "$"; } } return App.kpiUnit; }

  return `<div class="card kpi"><div style="min-width:0;flex:1"><div class="lbl">Net P&L ${badge ? `<span class="badge">${s.count}</span>` : ""}<span class="spacer"></span>

function calUnit() { if (!App.calUnit) { try { App.calUnit = localStorage.getItem("tj.calUnit") || "$"; } catch { App.calUnit = "$"; } } return App.calUnit; }
function calendarHead() {
  if (!App.calMonth) { const last = App.trades.length ? App.trades[App.trades.length - 1].date : isoD(new Date()); App.calMonth = last.slice(0, 7); }
  const [y, m] = App.calMonth.split("-").map(Number), u = calUnit();
  return `<div class="cal-head"><button class="icon-btn" data-cal="-1" aria-label="Previous month">‹</button><span class="m">${MONTHS[m - 1]} ${y}</span><button class="icon-btn" data-cal="1" aria-label="Next month">›</button></div>
    <div class="row" style="gap:6px"><div class="seg" role="group" aria-label="Show calendar in"><button data-unit="$" class="${u === "$" ? "on" : ""}" title="Show dollars">$</button><button data-unit="R" class="${u === "R" ? "on" : ""}" title="Show R-multiples">R</button></div><button class="btn ghost small" data-cal="0">This month</button></div>`;
}
function calendar(trades) {
  const [y, m] = App.calMonth.split("-").map(Number), useR = calUnit() === "R";
  const fmtRc = v => (v >= 0 ? "+" : "") + v.toFixed(1) + "R";
  const days = {};
  trades.filter(t => !t.open).forEach(t => {
    const d = days[t.date] = days[t.date] || { net: 0, n: 0, w: 0, r: 0, rn: 0, ts: [] }; d.ts.push(t);
    d.net += t.net; d.n++; if (t.net > 0) d.w++;
    if (t.r !== null && t.r !== undefined) { d.r += t.r; d.rn++; }
  });
  const val = d => useR ? d.r : d.net;
  const has = d => !useR || d.rn > 0;
  const first = new Date(y, m - 1, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const today = isoD(new Date());
  let html = `<div class="cal">${DOW.map(d => `<div class="dow">${d}</div>`).join("")}<div class="dow">Week</div>`;
  const cur = new Date(start); let wk = 1, missing = 0;
  const weeks = Math.ceil((first.getDay() + new Date(y, m, 0).getDate()) / 7);
  for (let w = 0; w < weeks; w++) {
    let wsum = 0, wdays = 0;
    for (let i = 0; i < 7; i++) {
      const iso = isoD(cur), d = days[iso], other = cur.getMonth() !== m - 1, show = d && !other;
      if (show) { if (has(d)) wsum += val(d); wdays++; missing += d.n - d.rn; }
      const v = show ? val(d) : 0;
      html += `<div class="cell ${other ? "other" : ""} ${show ? "has " + (has(d) ? (v >= 0 ? "pos" : "neg") : "") : ""} ${iso === today ? "today" : ""}" ${show ? `data-day="${iso}" title="Open ${iso} in the journal"` : ""}>
        <div class="cal-top">${show && avgGrade(d.ts) ? `<span class="grade ${gradeCls(avgGrade(d.ts))}" title="Day grade (average of graded trades)">${avgGrade(d.ts)}</span>` : ""}<span class="dn">${cur.getDate()}</span></div>${show ? `<span class="pl ${has(d) ? plClass(v) : "muted"}">${has(d) ? (useR ? fmtRc(v) : fmt$k(v)) : "no R"}</span><span class="tc">${d.n} trade${d.n > 1 ? "s" : ""} · ${Math.round(d.w / d.n * 100)}%</span>` : ""}</div>`;
      cur.setDate(cur.getDate() + 1);
    }
    html += `<div class="wk"><span class="wl">Week ${wk++}</span><span class="pl ${plClass(wsum)}">${!wdays ? (useR ? "0R" : "$0") : useR ? fmtRc(wsum) : fmt$k(wsum)}</span><span class="small muted">${wdays} day${wdays === 1 ? "" : "s"}</span></div>`;
  }
  html += "</div>";
  if (useR && missing) html += `<div class="small muted" style="margin-top:8px">${missing} trade${missing === 1 ? "" : "s"} this month ${missing === 1 ? "has" : "have"} no initial risk set, so ${missing === 1 ? "it's" : "they're"} left out of the R totals. <a href="#config">Set a default risk</a> or enter it on the trade.</div>`;
  return html;
}
function bindCalendar(c) {

function bindPremarket(c) {
  $$("[data-pm-zone]", c).forEach(z => {
    const d = z.dataset.pmZone, fi = $(`[data-pm-file="${d}"]`, z);
    const pick = () => pickImages(true, fi, files => addPremarket(d, files));
    z.onclick = e => { if (e.target !== fi) pick(); };
    z.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
    fi.onchange = () => { addPremarket(d, fi.files); fi.value = ""; };
    z.ondragover = e => { e.preventDefault(); e.stopPropagation(); z.classList.add("over"); };
    z.ondragleave = () => z.classList.remove("over");
    z.ondrop = e => { e.preventDefault(); e.stopPropagation(); z.classList.remove("over"); addPremarket(d, e.dataTransfer.files); };
  });
  $$("[data-pm-open]", c).forEach(b => b.onclick = () => { const [d, id] = b.dataset.pmOpen.split("|"); openLightbox("premarket", id, d); });
}

/* ---------- Trade log ---------- */
function pageTrades(c, banner) {
  let trades = filtered();
  const lf = App.logFilter;
  if (lf === "win") trades = trades.filter(t => t.net > 0 && !t.open);
  if (lf === "loss") trades = trades.filter(t => t.net < 0 && !t.open);
  if (lf === "untagged") trades = trades.filter(t => !t.ann.setup || t.ann.followed === undefined || t.ann.followed === null);
  if (lf === "broken") trades = trades.filter(t => t.ann.followed === false);
  const { key, dir } = App.sort;
  trades = trades.slice().sort((a, b) => { const x = a[key], y = b[key]; return (x === y ? 0 : x === null ? 1 : y === null ? -1 : x < y ? -1 : 1) * dir; });
  const s = Core.stats(trades);
  c.innerHTML = banner + `<div class="grid g-kpi">
    ${netTile(s, false)}

    <div class="card-b tbl-wrap">${tradeTable(trades, ["date", "time", "symbol", "side", "qty", "entry", "exit", "points", "r", "net", "dur", "setup", "mistakes", "grade", "plan"], true)}</div></div>`;
  $$("#lf button", c).forEach(b => b.onclick = () => { App.logFilter = b.dataset.v; render(); });

/* ---------- Reports ---------- */
function groupBy(trades, keyFn, order) {
  const g = {};
  trades.filter(t => !t.open).forEach(t => { [].concat(keyFn(t)).forEach(k => { if (k === null || k === undefined) return; (g[k] = g[k] || []).push(t); }); });
  let keys = Object.keys(g);
  if (order) keys = order.filter(k => g[k]); else keys.sort((a, b) => Core.stats(g[b]).net - Core.stats(g[a]).net);
  return keys.map(k => ({ key: k, s: Core.stats(g[k]) }));
}

function rulesOf(setup) {

}
function saveSetups(setups) { saveSettingsPatch({ setups }); }
function updateSetup(id, fn) { saveSetups(settings().setups.map(s => s.id === id ? fn({ ...s, rules: rulesOf(s) }) : s)); }
function untagSetup(id) {

    if (!doc || !doc.ann) continue;
    let changed = false; const nd = JSON.parse(JSON.stringify(doc));
    for (const a of Object.values(nd.ann)) if (a.setup === id) { a.setup = null; a.rules = []; changed = true; }
    if (changed) Store.saveDay(d, nd);

  if (App.filters.setup === id) { App.filters.setup = "all"; persistFilters(); }
}

/* ---------- Progress tracker ---------- */
function pageProgress(c, banner) {
  const trades = filtered({ noDate: true }).filter(t => !t.open);
  const fol = trades.filter(t => t.ann.followed === true), brk = trades.filter(t => t.ann.followed === false), un = trades.filter(t => t.ann.followed !== true && t.ann.followed !== false);
  const sf = Core.stats(fol), sb = Core.stats(brk);
  const byDay = {};
  trades.forEach(t => { const d = byDay[t.date] = byDay[t.date] || { f: 0, b: 0, n: 0 }; d.n++; if (t.ann.followed === true) d.f++; if (t.ann.followed === false) d.b++; });
  // streak of days fully followed
  let streak = 0; for (const d of Object.keys(byDay).sort().reverse()) { const x = byDay[d]; if (x.b === 0 && x.f > 0) streak++; else break; }
  // heatmap: last 26 weeks, Mon–Fri
  const end = new Date(); const start = new Date(end); start.setDate(start.getDate() - 7 * 26 - ((start.getDay() + 6) % 7));
  let cells = ""; const cur = new Date(start);
  while (cur <= end) {
    const dow = cur.getDay();
    if (dow >= 1 && dow <= 5) {
      const iso = isoD(cur), x = byDay[iso];
      let bg = "", title = iso + ": no trades";
      if (x) {
        const marked = x.f + x.b;
        if (!marked) { bg = "background:var(--border)"; title = iso + ": " + x.n + " trades, not reviewed"; }
        else { const p = x.f / marked; bg = `background:${p === 1 ? "var(--win-strong)" : p >= .5 ? "#fab219" : "var(--loss-strong)"}`; title = `${iso}: followed plan on ${x.f}/${marked} reviewed trades`; }
      }
      cells += `<i style="${bg}" title="${title}" ${x ? `data-day="${iso}"` : ""}></i>`;
    }
    cur.setDate(cur.getDate() + 1);
  }
  c.innerHTML = banner + `<div class="grid g-kpi">
    <div class="card kpi"><div><div class="lbl">Followed plan</div><div class="val">${sf.count + sb.count ? fmtPct(sf.count / (sf.count + sb.count)) : "—"}</div><div class="sub">${sf.count} of ${sf.count + sb.count} reviewed trades</div></div></div>
    <div class="card kpi"><div><div class="lbl">Clean-day streak</div><div class="val">${streak}</div><div class="sub">days with no broken rules</div></div></div>
    <div class="card kpi"><div><div class="lbl">Net P&L — followed plan</div><div class="val ${plClass(sf.net)}">${fmt$(sf.net)}</div><div class="sub">${fmt$(sf.expectancy)} / trade · ${fmtPct(sf.winRate)} win</div></div></div>
    <div class="card kpi"><div><div class="lbl">Net P&L — broke plan</div><div class="val ${plClass(sb.net)}">${fmt$(sb.net)}</div><div class="sub">${fmt$(sb.expectancy)} / trade · ${fmtPct(sb.winRate)} win</div></div></div>
    <div class="card kpi"><div><div class="lbl">Not reviewed yet</div><div class="val">${un.length}</div><div class="sub"><a href="#trades" id="pg-review">Review them</a></div></div></div></div>
  <div class="card"><div class="card-h"><h3>Discipline heatmap — last 26 weeks</h3></div><div class="card-b"><div class="heat">${cells}</div>
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--win-strong)"></i>All trades followed plan</span><span><i style="background:#fab219"></i>Mostly followed</span><span><i style="background:var(--loss-strong)"></i>Mostly broke plan</span><span><i style="background:var(--border)"></i>Traded, not reviewed</span><span><i style="background:var(--card-2);border:1px solid var(--border-2)"></i>No trades</span></div></div></div>
  <div class="card"><div class="card-h"><h3>Cumulative P&L: followed plan vs all trades</h3></div><div class="card-b"><div class="chart-box"><canvas id="pg-cmp"></canvas></div>
    <div class="legend" style="margin-top:8px"><span><i style="background:${cssVar("--accent")}"></i>Only trades where I followed my plan</span><span><i style="background:${cssVar("--muted")}"></i>All trades</span></div></div></div>`;
  $("#pg-review", c).onclick = () => { App.logFilter = "untagged"; };
  $$("[data-day]", c).forEach(el => { el.style.cursor = "pointer"; el.onclick = () => { App.journalFocus = el.dataset.day; App.filters.range = "all"; location.hash = "journal"; }; });
  const days = [...new Set(trades.map(t => t.date))].sort(); let a = 0, b = 0; const A = [], B = [];
  days.forEach(d => { trades.filter(t => t.date === d).forEach(t => { a += t.net; if (t.ann.followed === true) b += t.net; }); A.push(+a.toFixed(2)); B.push(+b.toFixed(2)); });
  mkChart("pg-cmp", { type: "line", data: { labels: days.map(fmtDateShort), datasets: [
    { label: "Followed plan", data: B, borderColor: cssVar("--accent"), borderWidth: 2, pointRadius: 0, tension: .2 },
    { label: "All trades", data: A, borderColor: cssVar("--muted"), borderWidth: 2, pointRadius: 0, tension: .2, borderDash: [5, 4] }] },
    options: { interaction: { mode: "index", intersect: false }, scales: { y: moneyAxis, x: catAxis }, plugins: { tooltip: { callbacks: { label: c => " " + c.dataset.label + ": " + fmt$(c.parsed.y) } } } } });
}

/* ---------- Export / backup ---------- */
async function offerDownload(filename, data, mime) {
  try {
    const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename, data, mimeType: mime }); return; }
  } catch (e) { if (e && /declin|cancel|reject/i.test(e.message || e.code || "")) return; }
  try { // plain browser fallback (works when opened outside claude.ai)
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  } catch {}
  openModal("Copy your export", `<p class="small t2" style="margin:0">If the download didn't start, copy this and save it as <b>${esc(filename)}</b>.</p><textarea id="exp-text" style="min-height:260px;font-family:ui-monospace,monospace;font-size:12px">${esc(data)}</textarea><div class="row"><span class="spacer"></span><button class="btn primary" id="exp-copy">Copy</button></div>`);
  $("#exp-copy").onclick = async () => { try { await navigator.clipboard.writeText(data); UI.toast("Copied"); } catch { $("#exp-text").select(); UI.toast("Press Ctrl/Cmd+C to copy"); } };
}
function exportBackup() {
  const data = JSON.stringify({ app: "trading-journal", version: 1, exported: new Date().toISOString(), days: Store.state.days, settings: Store.state.settings, notes: Store.state.notes }, null, 1);
  offerDownload("trading-journal-backup-" + isoD(new Date()) + ".json", data, "application/json");
}
function restoreBackup(file) {
  if (!file) return;
  file.text().then(txt => {
    const o = JSON.parse(txt);
    if (!o || o.app !== "trading-journal") throw new Error("Not a journal backup");
    let n = 0;
    for (const [d, doc] of Object.entries(o.days || {})) {
      const cur = Store.state.days[d];
      if (!cur) { Store.saveDay(d, doc); n++; continue; }
      const keys = new Set((cur.fills || []).map(f => f.k));
      const merged = { fills: [...(cur.fills || []), ...(doc.fills || []).filter(f => !keys.has(f.k))], journal: { ...(doc.journal || {}), ...(cur.journal || {}) }, ann: { ...(doc.ann || {}), ...(cur.ann || {}) } };
      Store.saveDay(d, merged); n++;
    }
    for (const [id, nt] of Object.entries(o.notes || {})) if (!Store.state.notes[id]) Store.saveNote(id, nt);
    if (o.settings && !Store.state.settings) Store.saveSettings(o.settings);
    recompute(); UI.toast("Restored " + n + " days");
  }).catch(e => UI.toast("Couldn't restore: " + e.message));
}
function exportTradesCSV(trades) {
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ["Date", "Account", "Symbol", "Side", "Qty", "Entry time", "Exit time", "Entry", "Exit", "Points", "Gross", "Commission", "Net", "R", "Setup", "Mistakes", "Followed plan", "Emotion", "Grade", "Notes"];
  const rows = trades.filter(t => !t.open).map(t => [t.date, t.account, t.symbol, t.side, t.qty, t.entryTime, t.exitTime, t.entry.toFixed(2), t.exit.toFixed(2), t.points.toFixed(2), t.gross.toFixed(2), t.commission.toFixed(2), t.net.toFixed(2), t.r === null ? "" : t.r.toFixed(2), setupName(t.ann.setup), (t.ann.mistakes || []).join("; "), t.ann.followed === true ? "Yes" : t.ann.followed === false ? "No" : "", t.ann.emotion || "", gradeOf(t.ann) || "", t.ann.notes || ""].map(q).join(","));
  offerDownload("trades-" + isoD(new Date()) + ".csv", [head.join(","), ...rows].join("\n"), "text/csv");
}

let softTimer;
function recomputeSoft() { clearTimeout(softTimer); softTimer = setTimeout(() => { const s = settings(); App.trades = Core.enrich(Core.buildTrades(App.fills, s), s, App.annMap).map(t => ({ ...t, gradeV: GRADE_VAL[gradeOf(t.ann)] || null })); render(); }, 50); }

function compressImage(file) {
  return new Promise(res => {
    const img = new Image(); img.onload = () => {
      let w = img.width, h = img.height, max = 1600;
      const draw = (mx, q) => { const sc = Math.min(1, mx / Math.max(w, h)); const cv = document.createElement("canvas"); cv.width = Math.round(w * sc); cv.height = Math.round(h * sc); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); return cv.toDataURL("image/jpeg", q); };
      let out = draw(max, .8);
      for (const [m, q] of [[1400, .72], [1200, .65], [1000, .6], [800, .55]]) { if (out.length < 240000) break; out = draw(m, q); }
      URL.revokeObjectURL(img.src); res(out);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function readFiles(files) { const sources = []; for (const f of files) sources.push({ name: f.name, text: await f.text() }); analyze(sources); }
function analyze(sources, manualMap) {
  const opts = { accountOverride: $("#imp-acct").value.trim() || null, fallbackDate: $("#imp-date").value, manualMap };
  let fills = [], warnings = [], needsDate = false, mapNeeded = null, skipped = 0;
  for (const s of sources) {
    const r = Core.importFills(s.text, opts);
    if (r.needsMap) { mapNeeded = { src: s, r }; continue; }
    if (r.needsDate) needsDate = true;
    fills.push(...r.fills); skipped += r.skipped;
    r.warnings.forEach(w => warnings.push(s.name + ": " + w));
  }
  $("#imp-date-wrap").style.display = needsDate || (pending && pending.needsDate) ? "flex" : "none";
  pending = { sources, fills, manualMap, needsDate };
  const pv = $("#imp-preview");
  if (mapNeeded) {
    const h = mapNeeded.r.headers, am = mapNeeded.r.autoMap || {};
    const fields = [["side", "Buy/Sell"], ["qtyFilled", "Qty filled"], ["price", "Fill price"], ["symbol", "Symbol"], ["time", "Time (date + time)"], ["account", "Account (optional)"], ["commission", "Commission (optional)"]];
    pv.innerHTML = `<div class="banner">I couldn't recognize the columns in <b>${esc(mapNeeded.src.name)}</b>. Match them up below.</div>
      <div class="kv">${fields.map(([k, l]) => `<label class="f">${l}<select class="sel" data-map="${k}"><option value="">—</option>${h.map((x, i) => `<option value="${i}" ${am[k] === i ? "selected" : ""}>${esc(x || "Column " + (i + 1))}</option>`).join("")}</select></label>`).join("")}</div>
      <button class="btn primary" id="map-go">Use these columns</button>`;
    $("#map-go").onclick = () => { const map = {}; $$("[data-map]").forEach(s => { if (s.value !== "") map[s.dataset.map] = +s.value; }); analyze(sources, { headerRow: mapNeeded.r.headerRowGuess, map }); };
    return;
  }
  const existing = new Set(App.fills.map(f => f.k));
  const seen = new Set(); const fresh = fills.filter(f => !existing.has(f.k) && !seen.has(f.k) && seen.add(f.k));
  const st = settings();
  const preview = Core.enrich(Core.buildTrades([...App.fills, ...fresh], st), st, App.annMap);
  const freshKeys = new Set(fresh.map(f => f.k));
  const newTrades = preview.filter(t => t.fills.some(f => freshKeys.has(f.k)));
  const dates = [...new Set(fresh.map(f => f.t.slice(0, 10)))].sort();
  const net = newTrades.filter(t => !t.open).reduce((a, t) => a + t.net, 0);
  pv.innerHTML = `<div class="kv"><div><div class="k">Executions found</div><div class="v">${fills.length}</div></div><div><div class="k">New</div><div class="v">${fresh.length}</div></div><div><div class="k">Already imported</div><div class="v">${fills.length - fresh.length}</div></div>
    <div><div class="k">Trades</div><div class="v">${newTrades.length}</div></div><div><div class="k">Dates</div><div class="v small">${dates.length ? fmtDateShort(dates[0]) + (dates.length > 1 ? " – " + fmtDateShort(dates[dates.length - 1]) : "") : "—"}</div></div><div><div class="k">Net P&L</div><div class="v ${plClass(net)}">${fmt$(net)}</div></div></div>
    ${newTrades.some(t => t.open) ? `<div class="banner">${newTrades.filter(t => t.open).length} position(s) are still open in this file — they'll close automatically when you import the day with the exit.</div>` : ""}
    ${warnings.length ? `<div class="small muted">${warnings.map(esc).join("<br>")}</div>` : ""}
    ${needsDate ? `<div class="banner">This file has times but no dates. Pick the trade date above, then import.</div>` : ""}
    ${skipped ? `<div class="small muted">${skipped} row(s) skipped (cancelled or unfilled orders).</div>` : ""}
    <div class="row"><span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="imp-go" ${fresh.length ? "" : "disabled"}>Import ${fresh.length} execution${fresh.length === 1 ? "" : "s"}</button></div>`;
  const go = $("#imp-go"); if (go) go.onclick = () => commitFills(fresh, newTrades.length);
}
function commitFills(fresh, nTrades) {
  const byDate = {};
  fresh.forEach(f => (byDate[f.t.slice(0, 10)] = byDate[f.t.slice(0, 10)] || []).push(f));
  for (const [d, fs] of Object.entries(byDate)) {
    const doc = JSON.parse(JSON.stringify(dayDoc(d)));
    doc.fills = [...(doc.fills || []), ...fs]; doc.journal = doc.journal || {}; doc.ann = doc.ann || {};
    Store.saveDay(d, doc);
  }
  pending = null; closeModal();
  const last = fresh.map(f => f.t).sort().pop(); if (last) App.calMonth = last.slice(0, 7);
  recompute(); UI.toast(`Imported ${nTrades} trade${nTrades === 1 ? "" : "s"}`);
}

function restoreBackup(file) {
  if (!file) return;
  file.text().then(txt => {
    const o = JSON.parse(txt);
    if (!o || o.app !== "trading-journal") throw new Error("Not a journal backup");
    let n = 0, imgs = 0;
    for (const [d, doc] of Object.entries(o.days || {})) {
      const cur = Store.state.days[d];
      if (!cur) { Store.saveDay(d, doc); n++; continue; }
      const keys = new Set((cur.fills || []).map(f => f.k));
      Store.saveDay(d, { fills: [...(cur.fills || []), ...(doc.fills || []).filter(f => !keys.has(f.k))], journal: { ...(doc.journal || {}), ...(cur.journal || {}) }, ann: { ...(doc.ann || {}), ...(cur.ann || {}) } }); n++;
    }
    for (const [id, nt] of Object.entries(o.notes || {})) if (!Store.state.notes[id]) Store.saveNote(id, nt);
    for (const [id, g] of Object.entries(o.gallery || {})) if (Store.importGallery(id, g)) imgs++;
    for (const [id, sh] of Object.entries(o.shots || {})) if (!Store.state.shots[id]) Store.saveShot(id, sh);
    if (o.settings && !Store.state.settings) Store.saveSettings(o.settings);
    recompute(); UI.toast(`Restored ${n} days${imgs ? " and " + imgs + " images" : ""}`);
  }).catch(e => UI.toast("Couldn't restore: " + e.message));
}

      const t1 = mins + Math.floor(rnd() * 25); const ts = m => `${ds}T${pad(Math.floor(m / 60))}:${pad(m % 60)}:${pad(Math.floor(rnd() * 59))}.000`;
      const win = rnd() < .46; const pts = win ? 3 + Math.floor(rnd() * 7) : -(3 + Math.floor(rnd() * 3));
      const xp = px + pts * (side === "B" ? 1 : -1); const t2 = t1 + 1 + Math.floor(rnd() * 14); mins = t2 + 4;
      const et = ts(t1), xt = ts(t2), o1 = "S" + ord++, o2 = "S" + ord++;
      fills.push({ k: Core.hash(["s", o1, et].join("|")), a: SAMPLE_ACCT, s: sym, side, q, p: px, t: et, o: o1, c: 2.1 * q });
      fills.push({ k: Core.hash(["s", o2, xt].join("|")), a: SAMPLE_ACCT, s: sym, side: side === "B" ? "S" : "B", q, p: xp, t: xt, o: o2, c: 2.1 * q });
    }
  }

  for (const [dt, fs] of Object.entries(byDate)) { const doc = JSON.parse(JSON.stringify(dayDoc(dt))); doc.fills = [...(doc.fills || []), ...fs]; doc.ann = doc.ann || {}; doc.journal = doc.journal || {}; Store.saveDay(dt, doc); }
  recompute();

function removeSample() {
  const ids = new Set(App.trades.filter(t => t.account === SAMPLE_ACCT).map(t => t.id));

    const r = Imp.analyze(s.text, { ...base, manual: manual[s.name] || null });

    if (r.needsMap) { mapNeeded = mapNeeded || { s, r }; continue; }
    if (r.needsDate) needsDate = true;

  pending = { sources, fills, needsDate, results, manual };
  if (mapNeeded) { mappingUI(mapNeeded.s, mapNeeded.r, `I couldn't fully recognize the columns in <b>${esc(mapNeeded.s.name)}</b>. I've filled in my best guesses — check them and press “Use these columns”.`); return; }
  const existing = new Set(App.fills.map(f => f.k));
  const seen = new Set(); const fresh = fills.filter(f => !existing.has(f.k) && !seen.has(f.k) && seen.add(f.k));
  const st = settings();
  const preview = Core.enrich(Core.buildTrades([...App.fills, ...fresh], st), st, App.annMap);
  const freshKeys = new Set(fresh.map(f => f.k));
  const newTrades = preview.filter(t => t.fills.some(f => freshKeys.has(f.k)));
  const dates = [...new Set(fresh.map(f => f.t.slice(0, 10)))].sort();
  const net = newTrades.filter(t => !t.open).reduce((a, t) => a + t.net, 0);
  const first = results[0] && results[0].r;
  const fieldsList = first ? (first.mode === "trades" ? Imp.TRADE_FIELDS : Imp.FILL_FIELDS) : [];
  const colLine = first ? fieldsList.filter(([k]) => first.map[k] !== undefined).map(([k, l]) => `${esc(l.replace(/ \(.*\)/, ""))}: <b>${esc(first.headers[first.map[k]] || "column " + (first.map[k] + 1))}</b>`).join(" · ") : "";
  const roots = [...new Set(newTrades.map(t => t.root))];
  const unknown = roots.filter(r => !Core.POINT_VALUES[r] && !((st.instruments || {})[r] && +(st.instruments[r].pv) > 0));
  $("#imp-preview").innerHTML = `<div class="kv"><div><div class="k">Executions found</div><div class="v">${fills.length}</div></div><div><div class="k">New</div><div class="v">${fresh.length}</div></div><div><div class="k">Already imported</div><div class="v">${fills.length - fresh.length}</div></div>
    <div><div class="k">Trades</div><div class="v">${newTrades.length}</div></div><div><div class="k">Dates</div><div class="v small">${dates.length ? fmtDateShort(dates[0]) + (dates.length > 1 ? " – " + fmtDateShort(dates[dates.length - 1]) : "") : "—"}</div></div><div><div class="k">Net P&L</div><div class="v ${plClass(net)}">${fmt$(net)}</div></div></div>
    ${colLine ? `<div class="small t2">Read as <b>${first.mode === "trades" ? "one trade per row" : "one fill per row"}</b> — ${colLine}. <a href="javascript:void 0" id="imp-adjust">Adjust columns</a></div>` : ""}
    ${unknown.length ? `<div class="banner"><span>New instrument${unknown.length > 1 ? "s" : ""}: <b>${unknown.map(esc).join(", ")}</b>. P&L uses $1 per point until you set the dollar value per point in Settings (fine for stocks).</span></div>` : ""}
    ${newTrades.some(t => t.open) ? `<div class="banner"><span>${newTrades.filter(t => t.open).length} position(s) are still open in this file — they'll close automatically when you import the day with the exit.</span></div>` : ""}
    ${warnings.length ? `<div class="small muted">${warnings.map(esc).join("<br>")}</div>` : ""}
    ${needsDate ? `<div class="banner"><span>This file has times but no dates. Pick the trade date above, then import.</span></div>` : ""}
    ${skipped ? `<div class="small muted">${skipped} row(s) skipped (cancelled, unfilled, or not a trade).</div>` : ""}
    <div class="row"><span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="imp-go" ${fresh.length ? "" : "disabled"}>Import ${fresh.length} execution${fresh.length === 1 ? "" : "s"}</button></div>`;
  const go = $("#imp-go"); if (go) go.onclick = () => commitFills(fresh, newTrades.length);
  const adj = $("#imp-adjust"); if (adj) adj.onclick = () => mappingUI(results[0].s, results[0].r, `Check how the columns in <b>${esc(results[0].s.name)}</b> were matched.`);
}
